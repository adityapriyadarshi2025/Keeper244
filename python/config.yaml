# Keeper244 bridge configuration.
# Every value here is a [PROPOSED] default from docs/PROJECT_BRIEF.md §4 / §5.3.
# Tune freely, but keep tunables HERE, never hard-coded in Python.
# P6 replaces these with values justified by real data.

acquisition:
  fs_nominal_hz: 2000          # chosen; BioRadio supports 250-16000 Hz. Verify real fs from timestamps (brief §6)
  channels: [biceps, triceps]

filters:
  bandpass:
    order: 4
    low_hz: 20
    high_hz: 450               # lowered to 0.45*fs automatically if the device fs is < 1000 Hz
  notch:
    enabled: true              # keep only if the PSD shows a mains peak (E1)
    freqs_hz: [50]             # optionally add 100, 150
    q: 30

envelope:
  method: rms                  # rms | lowpass
  rms_window_ms: 100
  hop_ms: 10                   # output rate = 1000 / hop_ms = 100 Hz
  lowpass_fc_hz: 5             # used only if method == lowpass (2nd-order Butterworth)

profiles:                      # filter settings to compare in the game (handout: effect of filtering on
                               # accuracy, response time, game performance). Overrides of filters/envelope above.
  default: full
  full: {}                     # band-pass 20-450 Hz + 50 Hz notch, 100 ms RMS (the settings above)
  bandpass:                    # band-pass only: mains hum stays in
    filters: {notch: {enabled: false}}
  raw:                         # no EMG filtering: DC removal only (1 Hz high-pass), so motion and mains stay in
    filters:
      highpass: {enabled: true, order: 1, cutoff_hz: 1}
      bandpass: {enabled: false}
      notch: {enabled: false}
  smooth:                      # steadier but slower: 250 ms RMS
    envelope: {rms_window_ms: 250}
  fast:                        # quicker but jumpier: 50 ms RMS
    envelope: {rms_window_ms: 50}

calibration:
  settle_s: 300                # electrode gel settling (operator can skip)
  ready_s: 3                   # "get ready" countdown before each recorded step
  rest_s: 10
  mvc_trials: 3
  mvc_trial_s: 5
  mvc_rest_s: 60               # operator can skip
  mvc_smoothing_ms: 500        # e_MVC = highest 500 ms moving average of the envelope
  comfort_trials: 3
  comfort_trial_s: 3
  comfort_rest_s: 3
  hold_trim: 0.2               # comfort level = mean of the middle 60 % of each hold (skip the ramps)
  activation_clip: [0.0, 1.5]
  theta_on_min: 0.10
  theta_on_noise_k: 4          # theta_on = max(theta_on_min, k * sigma_n)
  theta_off_ratio: 0.7
  far_hysteresis_h: 0.05
  default_theta_far: 0.35      # used when no comfort holds were recorded (3-zone only sessions)
  check_light_margin: 0.05     # a_light >= theta_on + margin
  check_light_strong_gap: 0.15 # a_strong - a_light >= gap
  quick:                       # --quick: a ~30 s calibration for simulator development only
    settle_s: 0
    ready_s: 1
    rest_s: 3
    mvc_trials: 1
    mvc_trial_s: 3
    mvc_rest_s: 1
    comfort_trials: 1
    comfort_trial_s: 3
    comfort_rest_s: 1

decision:
  dominance_k: 1.5
  dwell_s: 0.080

status:                        # sensor status sent in every packet (brief §4.7)
  saturation_fraction: 0.995   # a raw sample beyond 99.5 % of the device range counts as saturated
  flatline_uv: 0.5             # filtered envelope below this (µV) for flatline_s = lead off
  flatline_s: 1.0
  no_data_gap_s: 0.150         # source silent this long: log a gap and stop sending (Unity shows NO SIGNAL)
  max_missing_fraction: 0.25   # an envelope window with more missing samples is not trusted (status no_data)

network:
  host: 127.0.0.1
  out_port: 5005               # Python -> Unity, packets at envelope rate
  in_port: 5006                # Unity -> Python, events
  signal_timeout_s: 0.250      # Unity shows NO SIGNAL after this gap
  calib_every_s: 1.0

recording:
  root: ../data/sessions       # relative to python/

simulator:                     # SimulatedSource (brief §5.2): hardware-free development
  mvc_uv: 400                  # EMG RMS at 100 % MVC
  noise_uv: 6                  # broadband electrode / amplifier noise RMS
  mains_uv: 20                 # 50 Hz interference amplitude
  mains_hz: 50
  crosstalk: 0.08              # fraction of each muscle's EMG seen on the other channel
  ramp_tau_s: 0.06             # how fast the simulated muscle follows the drive
  chunk_ms: 20                 # deliver samples in bursts like a Bluetooth link (0 = every read)
  artifact_uv: 1500            # size of a simulated motion-artifact bump ('m' key)
  range_uv: 15000              # simulated ADC range (+/-), for the saturation status
  player:
    light: 0.22                # drive (fraction of MVC) for a light flex
    strong: 0.55               # ... and for a strong flex
    mvc: 1.0
    reaction_s: 0.35           # auto player: shot_cue -> starts flexing
    relax_after_s: 0.3         # auto player: arrival -> relaxes
    miss: 0.0                  # auto player: probability of flexing to a wrong slot

bioradio:                      # BioRadioSource (Windows only; brief §5.1)
  sdk_dll: vendor/BioRadioSDK.dll   # relative to python/; NOT in git (course kit, keep within IITGN)
  mac: null                    # e.g. "ECFE7E1836AF"; null = scan and pick the first BioRadio found
  channels:                    # which enabled biopotential channel is which muscle
    biceps: 1                  # 1-based position in BioCapture's enabled channel list, or the channel name
    triceps: 2
  poll_ms: 5                   # how often the bridge drains the SDK buffers

protocol:                      # python -m emg_bridge protocol (brief §6): >= 5 min per condition (handout)
  ready_s: 5
  rest_s: 300                  # relaxed: noise floor, PSD, random-process statistics
  contraction_block_s: 300     # per muscle: flex on cue, relax in between
  on_s: 5
  off_s: 5
  levels: [light, strong]      # alternate
  game_block_s: 300            # per filter profile below
  game_profiles: [full, raw, bandpass]   # rotate the order between participants
  break_s: 60                  # between blocks; Enter skips

monitor:
  window_s: 5                  # seconds of signal shown
  refresh_hz: 30
